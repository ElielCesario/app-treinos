<style>
/* Layout: coluna única estilo caderno de academia; o número (carga x reps) é a estrela, em fonte condensada de placa de anilha. */
:root{
  --bg:#eef0f2; --surface:#ffffff; --ink:#15181c; --muted:#646b73; --line:#d9dde1;
  --accent:#2447d6; --accent-ink:#ffffff; --pr:#a15c00; --pr-bg:#fdf0d5; --danger:#b3261e;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1114; --surface:#181b20; --ink:#eceef1; --muted:#9097a0; --line:#2a2f36;
  --accent:#7c9bff; --accent-ink:#0b1230; --pr:#f3c15b; --pr-bg:#3a2c0d; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1114; --surface:#181b20; --ink:#eceef1; --muted:#9097a0; --line:#2a2f36;
  --accent:#7c9bff; --accent-ink:#0b1230; --pr:#f3c15b; --pr-bg:#3a2c0d; --danger:#ff8a80; color-scheme:dark}
:root{--yolk:#f5a31a;--yolk-ink:#2b1a00}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--body);padding-block:12px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:700 30px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
.brand{display:flex;align-items:center;gap:10px}.brand img{border-radius:9px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{font:600 16px var(--display);letter-spacing:.04em;text-transform:uppercase;border:0;background:none;color:var(--muted);padding:7px 18px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fgrid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.fgrid label,.fgrid3 label{flex:none}
nav button{font:600 14.5px var(--display);letter-spacing:.02em;text-transform:uppercase;border:0;background:none;color:var(--muted);padding:9px 8px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;flex:1 1 120px}
input,select{font:500 17px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%;min-width:0}
input.big{font:700 26px var(--display);text-align:center;padding:8px}
.primary{font:700 22px var(--display);letter-spacing:.05em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:13px;width:100%;cursor:pointer}
.primary:disabled{opacity:.5}
.ghost{font:600 14px var(--body);background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.hint{font-size:14px;color:var(--muted);margin-top:10px}
.hint b{color:var(--ink);font-family:var(--display);font-size:17px;letter-spacing:.02em}
h2{font:700 20px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.ex{display:flex;flex-direction:column;gap:4px}
.ex+.ex{margin-top:14px}
.ex h3{font:600 18px var(--body);margin:0 0 2px}
.set{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.set:first-of-type{border-top:0}
.t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;width:44px}
.num{font:700 24px var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.rest{font-size:13px;color:var(--muted)}
.pr{font:700 13px var(--display);letter-spacing:.08em;background:var(--pr-bg);color:var(--pr);padding:2px 8px;border-radius:99px}
.x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:6px}
.x.armed{color:var(--danger);font-weight:600}
.empty{color:var(--muted);padding:22px 8px;text-align:center}
details.card>summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
.sub{color:var(--muted);font-size:14px}
.line{font-size:15px;padding:2px 0;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.n{font:700 19px var(--display)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20}
.status{font-size:13px;color:var(--muted)}
.status:empty{display:none}
.meta{padding:2px 4px}
.meta>summary{display:block;width:fit-content;margin-left:auto;cursor:pointer;font:700 15px var(--body);background:var(--yolk);color:var(--yolk-ink);padding:8px 16px;border-radius:99px;list-style:none}
.meta .row label{flex:1 1 100%}
.pen{font-size:24px;line-height:1;margin-left:8px;vertical-align:-3px;font-weight:700}
.ex>summary h3::before{content:"▸";display:inline-block;margin-right:10px;color:var(--accent);font-size:18px;transition:transform .12s}
.ex[open]>summary h3::before{transform:rotate(90deg)}
input[type="date"]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-height:46px;text-align:left}
input[type="date"]::-webkit-date-and-time-value{text-align:left}
.meta>summary::-webkit-details-marker{display:none}
.subnav{display:flex;gap:8px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.phead select{width:auto;max-width:55%;font-size:15px;padding:6px 8px}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;font:500 16px var(--body);color:var(--ink);cursor:pointer}
.prow:first-of-type{border-top:0}
.prow.cur{font-weight:700;color:var(--accent)}
.prow.done{color:var(--muted);cursor:default}
.pinfo{font-size:14px;color:var(--muted);margin-top:8px}
.rest-note{background:var(--pr-bg);color:var(--pr);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:500;margin:10px 0 4px}
.thead{flex-wrap:wrap;margin-bottom:14px}
.evo{gap:12px}
.evo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.evo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font:700 32px/1.1 var(--display);margin:2px 0}
.kpi .s{font-size:13px;color:var(--muted)}
.chart{min-width:0}.chart svg{display:block;max-width:100%}
.gl{stroke:var(--line);stroke-width:1}
.ax{font:500 11px var(--body);fill:var(--muted)}
.val{font:700 11px var(--body);fill:var(--ink)}
.bar{fill:var(--accent)}
:root{--mens:#e0568a}
.bar.mens{fill:var(--mens)}.dot.mens{fill:var(--mens);stroke:var(--mens)}
.metarow{position:relative}
.mens-box{display:flex;flex-direction:column;gap:6px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font:600 14px var(--body);color:var(--ink);margin-bottom:10px}
.mens-box .mtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mens-box .mdesc{font:400 13px/1.4 var(--body);color:var(--muted)}
.mens-box[hidden]{display:none}
.mens-box.on{border-color:var(--mens)}
.sw{width:40px;height:24px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--mens)}.sw[aria-checked="true"]::after{transform:translateX(16px)}
.lgm{background:var(--mens)}
.cal{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-h b{font:700 17px var(--display);letter-spacing:.04em;text-transform:uppercase}
.cal-h button{font:700 20px var(--body);background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;width:40px;height:36px;cursor:pointer}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-w{font:600 11px var(--body);color:var(--muted);text-align:center;padding:2px 0}
.cal-d{height:46px;border:0;border-radius:8px;background:none;color:var(--ink);font:600 15px var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0}
.cal-d small{font-size:11px;line-height:12px;height:12px;color:var(--accent)}
.cal-d.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-d.sel{background:var(--yolk);color:var(--yolk-ink)}.cal-d.sel small{color:var(--yolk-ink)}
.dn{font:700 32px var(--display);fill:var(--ink)}.ds{font:600 12px var(--body);fill:var(--muted)}
.cal-f{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.mk{stroke:var(--yolk);stroke-dasharray:4 3;stroke-width:1.5}
.mkt{font:600 10px var(--body);fill:var(--pr)}
.fmore{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.fmore>summary{cursor:pointer;font:600 15px var(--body);color:var(--ink);list-style:none}
.fmore>summary::-webkit-details-marker{display:none}
.fmore>summary::before{content:"▸";display:inline-block;margin-right:10px;color:var(--accent);transition:transform .12s}
.fmore[open]>summary::before{transform:rotate(90deg)}
.tl{stroke:var(--muted);stroke-width:1}
.tc{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.tbg{fill:var(--ink)}
.tt{font:600 12px var(--body);fill:var(--bg)}
.sb1{fill:var(--yolk)}.sb2{fill:var(--accent)}.sbt1{font:700 11px var(--body);fill:var(--yolk-ink)}.sbt2{font:700 11px var(--body);fill:var(--accent-ink)}
.leg{display:flex;gap:16px;margin-top:6px;font-size:13px;color:var(--muted)}.leg span{display:flex;align-items:center;gap:6px}.leg i{width:12px;height:12px;border-radius:3px;display:inline-block}.lg1{background:var(--yolk)}.lg2{background:var(--accent)}
.evo th,.evo td{padding:8px 8px}
.evo table{font-size:14px}
.evo td:first-child{white-space:normal}
.install{display:flex;gap:12px;align-items:flex-start}.install p{margin:0;font-size:15px;flex:1}.install b{font-weight:600}
.ajrow{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.ajrow:first-of-type{border-top:0}
.ajnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto auto;gap:6px;align-items:end}
.ajnums label{flex:none;font-size:11px}.ajnums input{padding:8px;text-align:center}
.iconbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;height:42px;min-width:40px;cursor:pointer;font:600 15px var(--body)}
.iconbtn.armed{color:var(--danger);border-color:var(--danger)}
.ajwk>summary{font:700 18px var(--display);letter-spacing:.04em;text-transform:uppercase}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.sobre-hero{text-align:center;padding:22px 16px;background:#0d1117;border-radius:12px;color:#f5f0e8}
.sobre-hero img{border-radius:18px;border:1px solid rgba(201,168,76,.5)}
.sobre-hero h2{font:italic 600 40px/1 Georgia,'Times New Roman',serif;color:#C9A84C;text-transform:none;letter-spacing:0;margin:12px 0 6px}
.sobre-hero p{margin:0;color:#c9c3b8;font-size:15px}
.sobre p,.sobre li{font-size:15.5px;line-height:1.5}
.sobre ul{margin:8px 0 0;padding-left:20px}.sobre li+li{margin-top:6px}
.sobre details.fmore p,.sobre details.fmore ul{margin-top:10px}
.sobre .pron{font:600 13px var(--body);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
#info-btn{white-space:nowrap}
.lock{position:fixed;inset:0;z-index:50;background:#0d1117;color:#f5f0e8;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.lock[hidden]{display:none}
.lock-in{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;text-align:center}
.lock-in img{margin:0 auto;border-radius:18px;border:1px solid rgba(201,168,76,.5)}
.lock-in h2{font:italic 600 38px/1 Georgia,serif;color:#C9A84C;text-transform:none;letter-spacing:0;margin:4px 0 0}
.lock-in p{margin:0;color:#c9c3b8;font-size:15px;line-height:1.45}
.lock-in label{color:#9aa1a9;text-align:left;flex:none}
.lock-in input{background:#161b22;border-color:#30363d;color:#f5f0e8}
.lock-in textarea{font:500 14px var(--body);background:#161b22;border:1px solid #30363d;color:#f5f0e8;border-radius:8px;padding:10px;width:100%;min-height:84px;resize:vertical}
.lock-in .primary{background:#C9A84C;color:#1a1405}
.lock-in .ghost{color:#f5f0e8;border-color:#30363d}
.lock-in .err{color:#ff8a80;font-size:14px;min-height:18px}
.lic{font-size:13px;color:var(--muted);margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{font:600 16px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:8px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cardio>summary h2::before{content:"▸";display:inline-block;margin-right:10px;color:var(--accent);font-size:18px;transition:transform .12s}
.cardio[open]>summary h2::before{transform:rotate(90deg)}
.dur{font:700 22px var(--display);letter-spacing:.03em;color:var(--accent)}
.subnav button{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 14px;cursor:pointer}
.subnav button[aria-selected="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.ex>summary{display:flex;justify-content:space-between;align-items:baseline;gap:10px;cursor:pointer;list-style:none;padding:4px 0}
.ex>summary::-webkit-details-marker{display:none}
.ex>summary h3{margin:0}
@media (prefers-reduced-motion:no-preference){.primary{transition:transform .08s}.primary:active{transform:scale(.98)}}
</style>

<div class="wrap">
  <header>
    <h1 class="brand"><img src="icons/icon-192.png" alt="" width="34" height="34"><span id="appname">Overa</span></h1>
    <button id="info-btn" class="ghost" type="button">ⓘ Sobre</button>
  </header>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="treinar" aria-selected="true">Treinar</button>
    <button role="tab" data-tab="evolucao" aria-selected="false">Evolução</button>
    <button role="tab" data-tab="nutri" aria-selected="false">Medidas</button>
    <button role="tab" data-tab="recordes" aria-selected="false">Recordes</button>
    <button role="tab" data-tab="historico" aria-selected="false">Histórico</button>
    <button role="tab" data-tab="dados" aria-selected="false">Dados</button>
    <button role="tab" data-tab="ajustes" aria-selected="false">Ajustes</button>
  </nav>
  <div class="card install" id="install" hidden></div>
  <div class="status" id="status"></div>

  <section id="tab-treinar">
    <div class="metarow"><div class="mens-box" id="mens-box" hidden></div>
    <details class="meta" id="meta">
      <summary id="metasum"></summary>
      <div class="row" style="margin-top:10px">
        <div style="flex:1 1 100%"><div class="cal" id="cal"></div><input id="date" type="date" style="display:none"></div>
        <label for="tipo" hidden>Treino<input id="tipo" list="tipos" placeholder="Ex.: Superior A" autocomplete="off"></label>
      </div>
      <datalist id="tipos"></datalist>
    </details></div>
    <div class="card" id="plan" hidden></div>
    <div class="card">
      <div class="row">
        <label for="ex" style="flex-basis:100%">Exercício<input id="ex" list="exs" placeholder="Ex.: Supino reto" autocomplete="off"></label>
        <label for="load">Carga (kg)<input id="load" class="big" inputmode="decimal" placeholder="0"></label>
        <label for="reps">Reps<input id="reps" class="big" inputmode="numeric" placeholder="0"></label>
      </div>
      <datalist id="exs"></datalist>
      <div class="hint" id="hint">Escolha um exercício para ver a última vez e a sugestão de carga.</div>
      <div style="height:12px"></div>
      <button class="primary" id="add">Registrar série</button>
    </div>
    <details class="card cardio" id="cardio">
      <summary><h2>Cardio e modalidades</h2><span class="sub" id="cardiosum"></span></summary>
      <div class="chips" id="ctypes"></div>
      <div class="row" style="margin-top:12px">
        <label for="cmin" style="flex:1 1 100%">Tempo (min)<input id="cmin" class="big" inputmode="decimal" placeholder="0"></label>
      </div>
      <div style="height:12px"></div>
      <div class="row" id="cnova" hidden style="margin-top:12px"><label for="cnome" style="flex:1 1 100%">Qual atividade?<input id="cnome" placeholder="Ex.: Boxe, Crossfit, Beach tennis" autocomplete="off"></label></div>
      <button class="primary" id="cadd">Registrar atividade</button>
    </details>
    <div class="card" id="today"></div>
  </section>

  <section id="tab-historico" hidden></section>
  <section id="tab-recordes" hidden></section>
  <section id="tab-evolucao" class="evo" hidden></section>
  <section id="tab-nutri" hidden></section>
  <section id="tab-dados" hidden></section>
  <section id="tab-ajustes" hidden></section>
  <section id="tab-sobre" hidden></section>
</div>

<script>
(function(){
const TZ='America/Sao_Paulo';
/* =====================================================================
   CONFIGURAÇÃO DO CLIENTE: personalize só este bloco para cada venda.
   Formato de cada exercício: ['Nome', séries, reps mínimas, reps máximas]
   (opcional 5º valor: passo; ex.: prancha em segundos, passo 5).
   Para alternativas: [['Opção 1','Opção 2'], 4, 8, 10]
   restAfter: dias de folga sugeridos depois daquele treino.
   ===================================================================== */
const CONFIG={

function annotate(p){ // marca recordes percorrendo o histórico em ordem
  const best={},pr=new Set();
  for(const s of personSessions(p)){s.sets.forEach((x,i)=>{const k=key(x.ex),b=best[k];
    if(b&&(x.load>b.load||(x.load===b.load&&x.reps>b.reps)))pr.add(s.date+'|'+i);
    if(!b||x.load>b.load||(x.load===b.load&&x.reps>b.reps))best[k]={load:x.load,reps:x.reps,date:s.date,ex:x.ex}})}

}
function exerciseNames(p){const c={};for(const s of personSessions(p))for(const x of s.sets){const k=key(x.ex);c[k]=c[k]||{n:x.ex,c:0};c[k].c++;c[k].n=x.ex}

const PLANS={eu:CONFIG.plano};
const OVR={};
function planSets(sp,date){let n=sp[1];for(const o of [].concat(sp[5]||[]).sort((a,b)=>a.from<b.from?-1:1))if(date>=o.from)n=o.sets;return n}
function matchWk(p,tipo){if(!tipo||!PLANS[p])return null;return PLANS[p].find(w=>new RegExp('^'+w.name+'(?![\\p{L}])','iu').test(tipo))||null}
function dayWorkout(){
  const p=state.person,list=PLANS[p];if(!list)return null;
  const s=state.sessions[p+'_'+state.date];const m=s&&matchWk(p,s.tipo);if(m)return {wk:m,prev:null};
  const ov=OVR[p+'_'+state.date];if(ov){const w=list.find(w=>w.name===ov);if(w)return {wk:w,prev:null}}
  const prev=personSessions(p).filter(x=>x.date<state.date&&matchWk(p,x.tipo));
  if(!prev.length)return {wk:list[0],prev:null};
  const ls=prev[prev.length-1],lw=matchWk(p,ls.tipo);
  return {wk:list[(list.indexOf(lw)+1)%list.length],prev:lw.name+' de '+br(ls.date).slice(0,5)};
}
function resolveEx(spec,s){const nm=spec[0];if(!Array.isArray(nm))return nm;
  const used=nm.find(n=>s&&s.sets.some(x=>key(x.ex)===key(n)));if(used)return used;
  const last=n=>{const l=lastTime(state.person,n,'9999-99-99');return l?l.date:'0000'};
  return nm.slice().sort((a,b)=>last(a)<last(b)?-1:last(a)>last(b)?1:0)[0]}
function suggest(name,n,spec,wk){
  const lo=spec[2],hi=spec[3],step=spec[4]||1,k=key(name);let l=null;
  const ss=personSessions(state.person).filter(s=>s.date<state.date).reverse();
  for(const s of ss){if(matchWk(state.person,s.tipo)===wk){const st=s.sets.filter(x=>key(x.ex)===k);if(st.length){l=st;break}}}
  if(!l){const lt=lastTime(state.person,name,state.date);l=lt&&lt.sets}
  if(!l)return {load:'',reps:lo};
  const b=l[Math.min(n,l.length-1)];
  if(b.load>0&&b.reps>=hi)return {load:b.load+2.5,reps:lo};
  return {load:b.load,reps:b.reps+step};
}
function restInfo(){ // folga é só aviso visual: vale logo depois de um treino que pede descanso e some se treinar
  const p=state.person,s=state.sessions[p+'_'+state.date];
  if(s&&s.sets.length)return false;
  const prev=personSessions(p).filter(x=>x.date<state.date&&x.sets.length&&matchWk(p,x.tipo));
  if(!prev.length)return false;
  const ls=prev[prev.length-1],n=matchWk(p,ls.tipo).restAfter||0;
  const d=Math.round((Date.parse(state.date+'T12:00:00Z')-Date.parse(ls.date+'T12:00:00Z'))/864e5);
  return d>=1&&d<=n;
}
function renderPlan(){

  const rows=wk.exs.map(sp=>{const name=resolveEx(sp,s);return {sp,name,total:planSets(sp,state.date),done:s?s.sets.filter(x=>key(x.ex)===key(name)).length:0}});
  if(state.focus){const f=rows.find(r=>r.name===state.focus);if(!f||f.done>=f.total)state.focus=null}
  const cur=(state.focus&&rows.find(r=>r.name===state.focus))||rows.find(r=>r.done<r.total)||null;
  const sel=h('select',{id:'wksel','aria-label':'Trocar treino'},PLANS[p].map(w=>h('option',{value:w.name},w.name)));sel.value=wk.name;
  sel.addEventListener('change',()=>{OVR[p+'_'+state.date]=sel.value;state.focus=null;state.fillKey=null;if(state.sessions[p+'_'+state.date]){$('tipo').value=sel.value;saveTipo()}else{$('tipo').value=''}renderAll()});
  const folga=restInfo();

  if(folga)box.append(h('div',{class:'rest-note'},'Hoje é dia de folga. Cardio é opcional. Se treinar hoje, a folga passa para o próximo dia.'));

  rows.forEach(r=>{const done=r.done>=r.total,isCur=cur===r;const unit=(r.sp[4]>1)?' s':' reps';
    const b=h('button',{type:'button',class:'prow'+(isCur?' cur':'')+(done?' done':'')},h('span',null,(done?'✓ ':'')+r.name),h('span',{class:'sub'},Math.min(r.done,r.total)+'/'+r.total+' · '+r.sp[2]+'–'+r.sp[3]+unit));

    box.append(b)});
  if(!cur){box.append(h('div',{class:'pinfo'},'Treino completo ✓ Se quiser, registre extras abaixo.'));return}
  const n=cur.done,fk=[p,state.date,wk.name,cur.name,n,Object.keys(state.sessions).length].join('|');

    $('ex').value=cur.name;$('load').value=sg.load===''?'':String(sg.load).replace('.',',');$('reps').value=String(sg.reps)}

const PI={manha:'☀️',tarde:'⛅️',noite:'🌙'};
function periodo(s){
  if(!s)return null;
  const ts=(s.sets||[]).map(x=>x.t).concat((s.cardio||[]).map(x=>x.t)).filter(t=>mins(t)!=null).sort((a,b)=>mins(a)-mins(b));
  if(!ts.length)return null;
  const m=mins(ts[0]);return m>=240&&m<720?'manha':m>=720&&m<1080?'tarde':'noite';
}
function donut(box,segs,total){
  const S=190,c=S/2,r=64,sw=30,C=2*Math.PI*r;
  const sg=sv('svg',{width:S,height:S,viewBox:'0 0 '+S+' '+S,style:'display:block;margin:0 auto'});
  sg.append(sv('circle',{cx:c,cy:c,r,fill:'none',stroke:'var(--line)','stroke-width':sw}));
  const ct=sv('text',{x:c,y:c+4,'text-anchor':'middle',class:'dn'},String(total)),cs=sv('text',{x:c,y:c+24,'text-anchor':'middle',class:'ds'},'treinos');
  let off=0;
  segs.forEach(g=>{if(!g.n)return;const len=C*g.n/total;
    const e=sv('circle',{cx:c,cy:c,r,fill:'none',stroke:g.color,'stroke-width':sw,'stroke-dasharray':len+' '+(C-len),'stroke-dashoffset':-off,transform:'rotate(-90 '+c+' '+c+')'});
    e.addEventListener('pointerdown',()=>{ct.textContent=String(g.n);cs.textContent=g.short+' '+Math.round(g.n/total*100)+'%'});
    off+=len;sg.append(e)});
  sg.append(ct,cs);
  box.replaceChildren(sg,h('div',{class:'leg',style:'justify-content:center;flex-wrap:wrap;margin-top:8px'},segs.filter(g=>g.n).map(g=>h('span',null,h('i',{style:'background:'+g.color}),g.label+': '+g.n+' ('+Math.round(g.n/total*100)+'%)'))));
}

function stackChart(box,items,unit,fixMax){
  const W=Math.max(box.clientWidth,260),H=210,L=38,R=6,T=14,B=26,n=items.length;
  const mx=fixMax||niceMax(Math.max(...items.map(i=>i.a+i.b)));
  const iw=(W-L-R)/n,bw=Math.max(6,Math.min(46,iw*0.62));
  const y=v=>T+(H-T-B)*(1-v/mx);
  const mo=items.map(i=>MES3[+i.date.slice(5,7)-1]+'/'+i.date.slice(2,4));
  const lab=items.map((i,k)=>mo.filter(m=>m===mo[k]).length>1?br(i.date).slice(0,5):mo[k]);
  const f=v=>nf(Math.round(v*10)/10)+(unit==='%'?'%':' kg');
  const s=sv('svg',{width:W,height:H,viewBox:'0 0 '+W+' '+H,role:'img',style:'touch-action:pan-y'});
  [0,.5,1].forEach(q=>{const v=mx*q;s.append(sv('line',{x1:L,x2:W-R,y1:y(v),y2:y(v),class:'gl'}),sv('text',{x:L-6,y:y(v)+4,'text-anchor':'end',class:'ax'},nf(Math.round(v))))});
  items.forEach((it,i)=>{const cx=L+iw*i+iw/2,x0=cx-bw/2,yb=y(it.b),ya=y(it.a+it.b);
    s.append(sv('rect',{x:x0,y:yb,width:bw,height:H-B-yb,class:'sb2'}),sv('rect',{x:x0,y:ya,width:bw,height:yb-ya,class:'sb1'}));
    const t=(v,yy,hh,c)=>{if(hh>16)s.append(sv('text',{x:cx,y:yy+hh/2+4,'text-anchor':'middle',class:c},nf(Math.round(v*10)/10)))};
    t(it.b,yb,H-B-yb,'sbt2');t(it.a,ya,yb-ya,'sbt1');
    s.append(sv('text',{x:cx,y:H-8,'text-anchor':'middle',class:'ax'},lab[i]))});
  const tip=addTip(s,W,H,T,B);
  const on=e=>{const r=s.getBoundingClientRect();const i=Math.min(n-1,Math.max(0,Math.floor((e.clientX-r.left-L)/iw)));const it=items[i];tip(L+iw*i+iw/2,y(it.a+it.b),br(it.date)+' · gordura '+f(it.a)+' · magra '+f(it.b),false)};
  s.addEventListener('pointerdown',on);s.addEventListener('pointermove',e=>{if(e.pressure>0||e.pointerType==='mouse')on(e)});
  box.replaceChildren(s);
  box.append(h('div',{class:'leg'},h('span',null,h('i',{class:'lg1'}),'Gordura'),h('span',null,h('i',{class:'lg2'}),'Massa magra')));
}

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.append(a);a.click();

function localDB(){
  const K='treinos-app-db';let data;
  try{data=JSON.parse(localStorage.getItem(K))||{}}catch(e){data={}}
  const subs={};
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(data))}catch(e){toast('Sem espaço para salvar neste aparelho')}};
  const snap=c=>({docs:Object.entries(data[c]||{}).map(([id,v])=>({id,data:()=>JSON.parse(JSON.stringify(v))})),metadata:{fromCache:false}});
  const emit=c=>(subs[c]||[]).forEach(f=>f(snap(c)));
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  return {
    doc(path){const [c,id]=path.split('/');return {
      set(v){(data[c]=data[c]||{})[id]=JSON.parse(JSON.stringify(v));save();emit(c);return Promise.resolve()},
      delete(){if(data[c])delete data[c][id];save();emit(c);return Promise.resolve()}}},
    collection(c){return {onSnapshot(f){(subs[c]=subs[c]||[]).push(f);setTimeout(()=>f(snap(c)));return ()=>{}}}},
    dump(){return JSON.parse(JSON.stringify(data))},
    load(d){data=d||{};save();Object.keys(subs).forEach(emit)}
  };
}

    const ok=await crypto.subtle.verify({name:'RSASSA-PKCS1-v1_5'},licKey,b64u(b),new TextEncoder().encode(a));
    if(!ok)return null;const pl=JSON.parse(new TextDecoder().decode(b64u(a)));pl.code=code;return pl}catch(e){return null}
}
function hojeLic(){ // usa a maior data já vista, para não burlar voltando o relógio
  const t=fmtDate(new Date()),seen=store('ov-seen')||'';const d=seen>t?seen:t;store('ov-seen',d);return d}
const fmtBR=d=>d?d.split('-').reverse().join('/'):'';
function licTexto(l){return l?(l.x?'válido até '+fmtBR(l.x):'vitalício'):''}
async function gate(){
  const box=$('lock');const l=await verLic(store('ov-lic'));
  if(l&&(!l.x||hojeLic()<=l.x)){state.lic=l;box.hidden=true;document.body.style.overflow='';return true}
  state.lic=null;lockScreen(l&&l.x?l:null);return false
}
function lockScreen(venc){
  const box=$('lock');box.hidden=false;document.body.style.overflow='hidden';
  const err=h('div',{class:'err'});
  const email=h('input',{type:'email',autocomplete:'email',inputmode:'email',placeholder:'seu@email.com',value:venc?venc.e:''});
  const cod=h('textarea',{placeholder:'Cole aqui o código ou o link que você recebeu',autocapitalize:'off',autocorrect:'off',autocomplete:'off',spellcheck:'false'});
  const go=h('button',{class:'primary'},'Entrar');
  go.onclick=async()=>{err.textContent='';go.disabled=true;const l=await verLic(cod.value);go.disabled=false;
    if(!l){err.textContent='Código inválido. Confira se copiou o código inteiro.';return}
    if((l.e||'').toLowerCase()!==email.value.trim().toLowerCase()){err.textContent='Este código não pertence a este e-mail.';return}
    if(l.x&&hojeLic()>l.x){err.textContent='Este código venceu em '+fmtBR(l.x)+'.';return}
    store('ov-lic',l.code);await gate();renderAll();toast('Bem-vindo(a), '+(l.n||'').split(' ')[0]+'!')};
  const zap=h('a',{class:'ghost',style:'text-decoration:none;display:block',target:'_blank',rel:'noopener',
    href:'https://wa.me/'+WHATS+'?text='+encodeURIComponent(venc?'Olá! Quero renovar meu acesso ao Overa ('+venc.e+').':'Olá! Quero adquirir o acesso ao Overa.')},venc?'Renovar meu acesso':'Quero adquirir o Overa');
  const kids=[h('img',{src:'icons/icon-192.png',width:72,height:72,alt:''}),h('h2',null,'Overa'),
    h('p',null,venc?'Seu acesso venceu em '+fmtBR(venc.x)+'. Seus treinos continuam salvos neste aparelho: renove e cole o novo código para continuar.':'Treino com dados. Evolução de verdade. Entre com o e-mail da compra e o seu código de acesso.'),
    h('label',null,'E-mail',email),h('label',null,'Código de acesso',cod),err,go,zap];
  if(venc){const bk=h('button',{class:'ghost'},'Baixar backup dos meus treinos');bk.onclick=()=>state.db&&exportBackup();kids.push(bk)}
  box.replaceChildren(h('div',{class:'lock-in'},kids));
}
async function checkLicHash(){
  const m=/^#licenca=(.+)/.exec(decodeURIComponent(location.hash));if(!m)return;
  history.replaceState(null,'',location.pathname+location.search);
  const l=await verLic(m[1]);
  if(l&&(!l.x||hojeLic()<=l.x)){store('ov-lic',l.code);await gate();renderAll();toast('Acesso ativado para '+l.e)}
  else toast(l?'Este código já venceu':'Link de acesso inválido');
}
function sairLic(){if(!confirm('Sair deste acesso? Seus treinos continuam salvos neste aparelho.'))return;store('ov-lic','');gate()}
(async()=>{await gate();await checkLicHash()})();
addEventListener('hashchange',checkLicHash);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')gate()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

(async()=>{
  const slow=setTimeout(()=>{if(!state.loaded)$('status').textContent='Ainda não consegui alcançar o banco. Os dados podem estar desatualizados.'},10000);
  state.db=localDB();
  if(!state.db){clearTimeout(slow);$('status').textContent='Não foi possível abrir o armazenamento do aparelho.';return}
  state.db.collection('sessions').onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});state.sessions=m;
    if(!snap.metadata.fromCache){state.loaded=true;clearTimeout(slow)}
    $('status').textContent=state.loaded?'':'Carregando…';
    syncTipoIfIdle();renderAll();
  },err=>{clearTimeout(slow);$('status').textContent='Erro ao ler o banco ('+((err&&err.code)||'desconhecido')+').'});
  applyCfg(savedCfg());aj=null;renderCardioForm();$('appname').textContent=CONFIG.appName;renderAll();if(state.tab==='ajustes')renderAjustes();checkPlanLink();checkAcesso();
  addEventListener('hashchange',()=>{checkPlanLink();checkAcesso()});
  state.db.collection('ciclo').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});state.ciclo=m;venceuPeriodo();renderAll()},()=>{});
  state.db.collection('avaliacoes').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});state.avs=m;if(state.tab==='nutri')renderNutri()},()=>{});
  function syncTipoIfIdle(){if(document.activeElement!==$('tipo'))syncTipo()}
})();
})();
